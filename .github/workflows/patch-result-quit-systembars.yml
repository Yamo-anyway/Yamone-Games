name: Patch result quit and system bars

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-result-quit-systembars.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch_result_quit.py
      - name: Commit changes
        run: |
          git config user.name Yamo
          git config user.email diahnet@naver.com
          git add app games
          git diff --cached --quiet && exit 0
          git commit -m "Add result quit actions and normalize system insets"
          git push
