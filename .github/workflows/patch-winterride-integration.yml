name: Patch WinterRide integration

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/patch-winterride-integration.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Integrate WinterRide into common game navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/yamone/games/YamoneGamesApp.kt')
          s = path.read_text()

          def once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'{label} anchor not found')
              s = s.replace(old, new, 1)

          once(
              'import com.yamone.games.sudoku.ui.SudokuApp\n',
              'import com.yamone.games.sudoku.ui.SudokuApp\nimport com.yamone.games.winterride.WinterRideScreen\n',
              'winterride import'
          )
          once(
              '    HOME, GAMES, RECORDS, SETTINGS, ONLINE_RANKING, SUDOKU, ICE_JUMP, FISH_MUNCH, SNOW_RUSH\n',
              '    HOME, GAMES, RECORDS, SETTINGS, ONLINE_RANKING, SUDOKU, ICE_JUMP, FISH_MUNCH, SNOW_RUSH, WINTER_RIDE\n',
              'app screen'
          )

          snow_case = '''            AppScreen.SNOW_RUSH -> SnowRushScreen(\n                onBack = goHome,\n                nickname = nickname,\n                playerHalfWidth = hitbox.halfWidth,\n                playerHalfHeight = hitbox.halfHeight,\n                onShareRecord = { shareRequest = ShareCardRequest(ArcadeGameId.SNOW_RUSH, it) },\n                primary = yamonePrimary(themeMode),\n                primaryDark = yamonePrimaryDark(themeMode),\n                soft = yamonePrimarySoft(themeMode),\n                ink = YamoneInk,\n                muted = YamoneMuted,\n                mascotContent = { size -> YamoneMascotIcon(mascot, size = size, accent = yamonePrimary(themeMode)) }\n            )\n'''
          winter_case = snow_case + '''            AppScreen.WINTER_RIDE -> WinterRideScreen(\n                onBack = goHome,\n                primary = yamonePrimary(themeMode),\n                primaryDark = yamonePrimaryDark(themeMode),\n                soft = yamonePrimarySoft(themeMode),\n                ink = YamoneInk,\n                muted = YamoneMuted,\n                mascotContent = { size -> YamoneMascotIcon(mascot, size = size, accent = yamonePrimary(themeMode)) }\n            )\n'''
          once(snow_case, winter_case, 'winterride screen case')

          once(
              '''                            onSnowRush = { requestGameStart(AppScreen.SNOW_RUSH) },\n                            onRecords = { screenName = AppScreen.RECORDS.name }\n''',
              '''                            onSnowRush = { requestGameStart(AppScreen.SNOW_RUSH) },\n                            onWinterRide = { requestGameStart(AppScreen.WINTER_RIDE) },\n                            onRecords = { screenName = AppScreen.RECORDS.name }\n''',
              'home call'
          )
          once(
              '''                            onSnowRush = { requestGameStart(AppScreen.SNOW_RUSH) }\n                        )\n''',
              '''                            onSnowRush = { requestGameStart(AppScreen.SNOW_RUSH) },\n                            onWinterRide = { requestGameStart(AppScreen.WINTER_RIDE) }\n                        )\n''',
              'games call'
          )

          once(
              '''    onFishMunch: () -> Unit,\n    onSnowRush: () -> Unit,\n    onRecords: () -> Unit\n''',
              '''    onFishMunch: () -> Unit,\n    onSnowRush: () -> Unit,\n    onWinterRide: () -> Unit,\n    onRecords: () -> Unit\n''',
              'home signature'
          )
          once(
              '''        GameListItem("물고기 냠냠", "좌우로 움직여 물고기를 받아먹어요", "≈", onFishMunch),\n        GameListItem("눈덩이 러시", "눈덩이와 눈송이를 피해 오래 버텨요", "❄", onSnowRush)\n''',
              '''        GameListItem("물고기 냠냠", "좌우로 움직여 물고기를 받아먹어요", "≈", onFishMunch),\n        GameListItem("눈덩이 러시", "눈덩이와 눈송이를 피해 오래 버텨요", "❄", onSnowRush),\n        GameListItem("스키 · 보드", "스키·스노보드·트리런으로 설원을 달려요", "⛷", onWinterRide)\n''',
              'home list'
          )

          once(
              '''    onFishMunch: () -> Unit,\n    onSnowRush: () -> Unit\n) {\n    val puzzle''',
              '''    onFishMunch: () -> Unit,\n    onSnowRush: () -> Unit,\n    onWinterRide: () -> Unit\n) {\n    val puzzle''',
              'games signature'
          )
          once(
              '''        GameListItem("물고기 냠냠", "일반 / 60초 타임어택", "≈", onFishMunch),\n        GameListItem("눈덩이 러시", "쏟아지는 눈을 피해 오래 생존", "❄", onSnowRush)\n''',
              '''        GameListItem("물고기 냠냠", "일반 / 60초 타임어택", "≈", onFishMunch),\n        GameListItem("눈덩이 러시", "쏟아지는 눈을 피해 오래 생존", "❄", onSnowRush),\n        GameListItem("스키 · 보드", "스키 / 스노보드 / 트리런", "⛷", onWinterRide)\n''',
              'games list'
          )

          path.write_text(s)

          main = '''package com.yamone.games\n\nimport android.os.Bundle\nimport androidx.activity.ComponentActivity\nimport androidx.activity.compose.setContent\nimport androidx.compose.foundation.background\nimport androidx.compose.foundation.isSystemInDarkTheme\nimport androidx.compose.foundation.layout.Box\nimport androidx.compose.foundation.layout.WindowInsets\nimport androidx.compose.foundation.layout.WindowInsetsSides\nimport androidx.compose.foundation.layout.fillMaxSize\nimport androidx.compose.foundation.layout.only\nimport androidx.compose.foundation.layout.safeDrawing\nimport androidx.compose.foundation.layout.windowInsetsPadding\nimport androidx.compose.runtime.getValue\nimport androidx.compose.runtime.mutableStateOf\nimport androidx.compose.runtime.remember\nimport androidx.compose.runtime.setValue\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.graphics.Color\nimport com.yamone.games.sudoku.ui.theme.YamoneSudokuTheme\n\nclass MainActivity : ComponentActivity() {\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n\n        // UMP consent/privacy status is refreshed before the Mobile Ads SDK is initialized.\n        YamonePrivacy.start(this) { canRequestAds ->\n            if (canRequestAds) {\n                YamoneAdMob.initialize(applicationContext)\n            }\n        }\n\n        setContent {\n            val prefs = remember { AppPreferences(applicationContext) }\n            var themeMode by remember { mutableStateOf(prefs.themeMode()) }\n            var mascot by remember { mutableStateOf(prefs.mascot()) }\n            var nickname by remember { mutableStateOf(prefs.nickname()) }\n            val systemBarBackground = if (isSystemInDarkTheme()) Color.Black else Color.White\n\n            YamoneSudokuTheme(themeMode) {\n                Box(\n                    Modifier\n                        .fillMaxSize()\n                        .background(systemBarBackground)\n                        .windowInsetsPadding(\n                            WindowInsets.safeDrawing.only(WindowInsetsSides.Vertical)\n                        )\n                ) {\n                    YamoneGamesApp(\n                        themeMode = themeMode,\n                        mascot = mascot,\n                        nickname = nickname,\n                        onThemeChange = {\n                            themeMode = it\n                            prefs.setThemeMode(it)\n                        },\n                        onMascotChange = {\n                            mascot = it\n                            prefs.setMascot(it)\n                        },\n                        onNicknameChange = {\n                            nickname = it.take(AppPreferences.MAX_NICKNAME_LENGTH)\n                            prefs.setNickname(nickname)\n                        }\n                    )\n                }\n            }\n        }\n    }\n}\n'''
          Path('app/src/main/java/com/yamone/games/MainActivity.kt').write_text(main)

          gradle = Path('app/build.gradle.kts')
          g = gradle.read_text()
          if 'versionCode = 40' not in g or 'versionName = "1.1.0-dev34"' not in g:
              raise SystemExit('version anchor not found')
          g = g.replace('versionCode = 40', 'versionCode = 41', 1)
          g = g.replace('versionName = "1.1.0-dev34"', 'versionName = "1.1.0-dev35"', 1)
          gradle.write_text(g)
          PY
      - name: Commit changes
        run: |
          git config user.name "Yamo"
          git config user.email "diahnet@naver.com"
          git add app/src/main/java/com/yamone/games/YamoneGamesApp.kt app/src/main/java/com/yamone/games/MainActivity.kt app/build.gradle.kts
          git diff --cached --quiet && exit 0
          git commit -m "Integrate WinterRide into game lists and common navigation"
          git push
