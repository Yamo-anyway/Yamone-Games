name: Unify start button widths

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/unify-start-button-widths.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply button width patch
        run: python .github/scripts/unify_start_button_widths.py
      - name: Commit changes
        run: |
          git config user.name Yamo
          git config user.email diahnet@naver.com
          git add app games
          git diff --cached --quiet && exit 0
          git commit -m "Unify game start button widths"
          git push
