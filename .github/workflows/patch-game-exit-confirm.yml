name: Fix FishMunch exit dialog placement

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/patch-game-exit-confirm.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Move FishMunch exit dialog into screen body
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('games/fishmunch/src/main/java/com/yamone/games/fishmunch/FishMunchScreen.kt')
          s = p.read_text()

          helper_start = s.index('private fun normalFishSize')
          pretty_start = s.index('@Composable\nprivate fun PrettyFish', helper_start)
          helpers = '''private fun normalFishSize(kind: Int): Dp = when (kind) {\n    0 -> 40.dp\n    2 -> 70.dp\n    else -> 54.dp\n}\n\nprivate fun timeAttackFishSize(kind: Int): Dp = when (kind) {\n    0 -> 34.dp\n    2 -> 60.dp\n    else -> 46.dp\n}\n\n'''
          s = s[:helper_start] + helpers + s[pretty_start:]

          marker = '\n}\n\nprivate fun normalFishSize'
          idx = s.index(marker)
          dialog = '''\n\n    if (exitConfirm) {\n        AlertDialog(\n            onDismissRequest = { exitConfirm = false },\n            shape = RoundedCornerShape(24.dp),\n            title = { Text("게임을 그만둘까요?", fontWeight = FontWeight.Black, color = ink) },\n            text = { Text("게임이 일시정지됐어요. 계속 플레이하거나 현재 게임을 종료할 수 있어요.", color = muted) },\n            confirmButton = {\n                TextButton(onClick = { exitConfirm = false }) {\n                    Text("계속하기", fontWeight = FontWeight.Bold, color = primaryDark)\n                }\n            },\n            dismissButton = {\n                TextButton(onClick = {\n                    state.started = false\n                    exitConfirm = false\n                    onBack()\n                }) { Text("게임 종료", fontWeight = FontWeight.Bold, color = Color(0xFFD85C6A)) }\n            }\n        )\n    }\n'''
          s = s[:idx] + dialog + s[idx:]
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "Yamo"
          git config user.email "diahnet@naver.com"
          git add games/fishmunch/src/main/java/com/yamone/games/fishmunch/FishMunchScreen.kt
          git commit -m "Fix FishMunch exit confirmation placement"
          git push
