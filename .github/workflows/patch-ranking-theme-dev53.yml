name: Patch Yamone ranking and theme dev53

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/patch-ranking-theme-dev53.yml"

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Normalize dev53 patch runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/patch-ranking-theme-dev53.py')
          s = p.read_text()
          old = '''replace_once(
              APP,
              '                if (ONLINE_RANKING_VISIBLE) scope.launch { rankingRepository.syncSharingState(nickname) }',
              '                scope.launch { rankingRepository.syncSharingState(nickname) }',
              "ranking reconnect",
          )'''
          new = '''p = Path(APP)
          s = p.read_text()
          old = '                if (ONLINE_RANKING_VISIBLE) scope.launch { rankingRepository.syncSharingState(nickname) }'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f"ranking reconnect: expected 2 matches, found {count}")
          p.write_text(s.replace(old, '                scope.launch { rankingRepository.syncSharingState(nickname) }'))'''
          if old not in s:
              raise SystemExit('ranking reconnect patch block not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Apply dev53 patch
        run: python3 .github/scripts/patch-ranking-theme-dev53.py

      - name: Check diff
        run: |
          git diff --check
          git diff --stat

      - name: Check worker syntax
        run: node --check cloudflare/ranking-worker.js

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app games cloudflare/ranking-worker.js
          git commit -m "Add ranking tab and themed bottom navigation"
          git push origin HEAD:main
