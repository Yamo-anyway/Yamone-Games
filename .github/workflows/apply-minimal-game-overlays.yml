name: Apply minimal game overlays

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-minimal-game-overlays.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply minimal overlays
        run: python .github/scripts/apply_minimal_game_overlays.py
      - name: Commit changes
        run: |
          git config user.name Yamo
          git config user.email diahnet@naver.com
          git add app games
          git diff --cached --quiet && exit 0
          git commit -m "Simplify game start overlays and back arrows"
          git push
