name: Fix dev54 ranking copy

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/fix-dev54-ranking-copy.yml"

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fix Korean copy
        run: python3 .github/scripts/fix-dev54-ranking-copy.py

      - name: Check diff
        run: git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Commit validated copy fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/yamone/games/OnlineRankingUi.kt
          git commit -m "Fix 순위 screen Korean copy"
          git push origin HEAD:main
