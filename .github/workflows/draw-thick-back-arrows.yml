name: Draw thick back arrows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/draw-thick-back-arrows.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply thick back arrows
        run: python .github/scripts/draw_thick_back_arrows.py
      - name: Commit changes
        run: |
          git config user.name Yamo
          git config user.email diahnet@naver.com
          git add games
          git diff --cached --quiet && exit 0
          git commit -m "Draw thicker standalone back arrows"
          git push
