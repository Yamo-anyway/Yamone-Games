name: Apply Yamone UI polish refresh

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/apply-polish-refresh.yml"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply-polish-refresh.py')
          s = p.read_text()
          old = '    3,\n    "hide ad timer cards during dev bypass",\n)'
          new = '    2,\n    "hide ad timer cards during dev bypass",\n)'
          if old not in s:
              raise SystemExit('ad-card expectation anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 .github/scripts/apply-polish-refresh.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/yamone/games/YamoneGamesApp.kt')
          s = p.read_text()
          old = '''        if (!adRemoved) {
            Text("광고", fontSize = 18.sp, fontWeight = FontWeight.ExtraBold, color = YamoneInk)
            AdFreeTimeCard(themeMode, adFreeUntilMillis, onAdAccess)
        }
'''
          new = '''        if (!adRemoved && !DEV_AD_TIMER_BYPASS) {
            Text("광고", fontSize = 18.sp, fontWeight = FontWeight.ExtraBold, color = YamoneInk)
            AdFreeTimeCard(themeMode, adFreeUntilMillis, onAdAccess)
        }
'''
          if old not in s:
              raise SystemExit('settings ad timer block not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Check diff
        run: |
          git diff --check
          git diff --stat

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app games
          git commit -m "Polish Yamone game UI and pause ad timers"
          git push origin HEAD:main
