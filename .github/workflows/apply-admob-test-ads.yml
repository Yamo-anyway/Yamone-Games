name: Apply AdMob test ads

on:
  push:
    paths:
      - '.github/scripts/apply_admob_test_ads.py'
      - '.github/workflows/apply-admob-test-ads.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply AdMob test patch
        run: python .github/scripts/apply_admob_test_ads.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "Yamo"
          git config user.email "diahnet@naver.com"
          git add app/src/main/java/com/yamone/games/YamoneGamesApp.kt
          git commit -m "Use real AdMob test ads in app flow"
          git push
