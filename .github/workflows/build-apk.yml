name: Build Yamone Games APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "games/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Yamone test signing key
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: yamone-games-debug-keystore-v2
          fail-on-cache-miss: true

      - name: Verify Yamone test signing key
        shell: bash
        run: |
          test -f "$HOME/.android/debug.keystore"
          echo "Signing keystore certificate:"
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | grep -E "Owner:|SHA256:"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK signing certificate
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: Yamone-Games-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
