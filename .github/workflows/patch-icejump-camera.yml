name: Patch IceJump camera position

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/patch-icejump-camera.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Move IceJump player camera line up by one character height
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('games/icejump/src/main/java/com/yamone/games/icejump/IceJumpScreen.kt')
          s = p.read_text()
          old = '        private const val CAMERA_LINE = 0.34f\n'
          new = '        // Keep the player about one full character-height higher on screen while scrolling.\n        // PLAYER_HALF_HEIGHT is 0.045, so one character height is 0.09.\n        private const val CAMERA_LINE = 0.25f\n'
          if old not in s:
              raise SystemExit('CAMERA_LINE anchor not found')
          p.write_text(s.replace(old, new, 1))

          g = Path('app/build.gradle.kts')
          t = g.read_text()
          t = t.replace('versionCode = 36', 'versionCode = 37', 1)
          t = t.replace('versionName = "1.1.0-dev30"', 'versionName = "1.1.0-dev31"', 1)
          g.write_text(t)
          PY
      - name: Commit changes
        run: |
          git config user.name "Yamo"
          git config user.email "diahnet@naver.com"
          git add games/icejump/src/main/java/com/yamone/games/icejump/IceJumpScreen.kt app/build.gradle.kts
          git commit -m "Move IceJump character view position upward"
          git push
