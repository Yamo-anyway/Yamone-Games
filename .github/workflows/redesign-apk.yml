name: Yamone 0.3 redesign APK
on:
  workflow_dispatch:
  push:
    branches: ["develop/0.3.x"]
permissions:
  contents: write
  actions: read
concurrency:
  group: yamone-redesign-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Materialize hash-verified v0.3.02 sources
        run: |
          python tools/v032/apply.py
          if [ -n "$(git status --porcelain app games cloudflare docs tools/v032)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app games cloudflare docs tools/v032
            git commit -m 'feat: materialize v0.3.02 scenery and snow fragment gameplay [skip ci]'
            git push origin HEAD:develop/0.3.x
          fi
      - name: Export tracked source snapshot
        run: git archive --format=zip -o /tmp/yamone-source.zip HEAD
      - uses: actions/upload-artifact@v5
        with:
          name: Yamone-source-${{ github.run_number }}
          path: /tmp/yamone-source.zip
          retention-days: 30
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Verify precise and legacy ranking SQL with isolated local database
        run: |
          set -o pipefail
          node --test cloudflare/tests/ranking-precision.test.mjs 2>&1 | tee /tmp/worker-tests.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore existing signing identity
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: yamone-games-debug-keystore-v2
          fail-on-cache-miss: true
      - name: Require existing signing identity
        run: test -f "$HOME/.android/debug.keystore"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
      - name: Compile and run unit tests
        run: |
          set -o pipefail
          gradle :app:assembleDebug testDebugUnitTest --no-daemon --continue 2>&1 | tee /tmp/build.log
      - name: Capture concise build report
        if: always()
        run: grep -E '^e:|FAILED|BUILD |tests|^> Task .*Test' /tmp/build.log > /tmp/build-summary.txt || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Yamone-build-log-${{ github.run_number }}
          path: |
            /tmp/build-summary.txt
            /tmp/worker-tests.txt
          retention-days: 30
      - name: Verify installation package
        run: |
          mkdir -p /tmp/yamone-output
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee /tmp/yamone-output/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > /tmp/yamone-output/package.txt
          git rev-parse HEAD > /tmp/yamone-output/source-commit.txt
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/yamone-output/Yamone-Games.apk
          cd /tmp/yamone-output && sha256sum Yamone-Games.apk > SHA256SUMS.txt
      - name: Read-only deployment capability check
        run: |
          curl --max-time 10 -fsS https://yamone-games-ranking-api.yamone0479.workers.dev/health > /tmp/yamone-output/ranking-server-health.json || echo '{"check":"unreachable"}' > /tmp/yamone-output/ranking-server-health.json
      - uses: actions/upload-artifact@v5
        with:
          name: Yamone-APK-${{ github.run_number }}
          path: /tmp/yamone-output/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Yamone-test-results-${{ github.run_number }}
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 30
  smoke:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Yamone-source-${{ github.run_number }}
          path: source-archive
      - name: Use exact source associated with this APK
        run: mkdir -p under-test && unzip -q source-archive/yamone-source.zip -d under-test
      - uses: actions/download-artifact@v5
        with:
          name: Yamone-APK-${{ github.run_number }}
          path: apk
      - uses: actions/download-artifact@v5
        with:
          name: Yamone-APK-3
          path: baseline
          run-id: 35065981699
          github-token: ${{ github.token }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify upgrade, layouts, all games and precise snow records
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python under-test/tools/v032/smoke.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Yamone-device-smoke-${{ github.run_number }}
          path: smoke-output/*
          if-no-files-found: ignore
          retention-days: 30
