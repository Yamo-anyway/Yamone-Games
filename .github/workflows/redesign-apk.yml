name: Yamone 0.3 redesign APK
on:
  workflow_dispatch:
  push:
    branches: ["develop/0.3.x"]
permissions:
  contents: read
  actions: read
concurrency:
  group: yamone-redesign-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify materialized stage-two source and artwork
        run: python tools/v034/verify_source.py
      - name: Export exact source snapshot
        run: git archive --format=zip -o /tmp/yamone-source.zip HEAD
      - uses: actions/upload-artifact@v5
        with:
          name: Yamone-source-${{ github.run_number }}
          path: /tmp/yamone-source.zip
          retention-days: 30
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Check unchanged ranking compatibility offline
        run: |
          set -o pipefail
          node --test cloudflare/tests/ranking-precision.test.mjs 2>&1 | tee /tmp/worker-tests.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore existing signing identity
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: yamone-games-debug-keystore-v2
          fail-on-cache-miss: true
      - run: test -f "$HOME/.android/debug.keystore"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
      - name: Compile and run all unit tests
        run: |
          set -o pipefail
          gradle :app:assembleDebug testDebugUnitTest --no-daemon --continue 2>&1 | tee /tmp/build.log
      - name: Capture build report
        if: always()
        run: grep -E '^e:|FAILED|BUILD |tests|^> Task .*Test' /tmp/build.log > /tmp/build-summary.txt || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Yamone-build-log-${{ github.run_number }}
          path: |
            /tmp/build-summary.txt
            /tmp/worker-tests.txt
          retention-days: 30
      - name: Verify APK version and original signing certificate
        run: |
          mkdir -p /tmp/yamone-output
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee /tmp/yamone-output/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > /tmp/yamone-output/package.txt
          grep -q 'f86fa103789fe5c6532161a7553e3f691dd7fd319d61303ccaa799ff28adee6e' /tmp/yamone-output/signature.txt
          grep -q "versionName='0.3.04'" /tmp/yamone-output/package.txt
          git rev-parse HEAD > /tmp/yamone-output/source-commit.txt
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/yamone-output/Yamone-Games.apk
          cd /tmp/yamone-output && sha256sum Yamone-Games.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v5
        with:
          name: Yamone-APK-${{ github.run_number }}
          path: /tmp/yamone-output/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Yamone-test-results-${{ github.run_number }}
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 30
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Yamone-source-${{ github.run_number }}
          path: source-archive
      - run: mkdir -p under-test && unzip -q source-archive/yamone-source.zip -d under-test
      - uses: actions/download-artifact@v5
        with:
          name: Yamone-APK-${{ github.run_number }}
          path: apk
      - uses: actions/download-artifact@v5
        with:
          name: Yamone-APK-6
          path: baseline
          run-id: 35182211250
          github-token: ${{ github.token }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify update, snow artwork, dodge limits and retained ad policy
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: python under-test/tools/v034/smoke.py
      - name: Capture emulator host diagnostics
        if: failure()
        run: |
          mkdir -p smoke-output
          sudo dmesg | tail -150 > smoke-output/host-kernel-tail.txt || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Yamone-device-smoke-${{ github.run_number }}
          path: smoke-output/*
          if-no-files-found: ignore
          retention-days: 30
