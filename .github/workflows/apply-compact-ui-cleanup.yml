name: Apply compact UI cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-compact-ui-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply compact UI cleanup
        run: python .github/scripts/apply_compact_ui_cleanup.py
      - name: Commit changes
        run: |
          git config user.name Yamo
          git config user.email diahnet@naver.com
          git add app games
          git diff --cached --quiet && exit 0
          git commit -m "Simplify game UI and compact records"
          git push
