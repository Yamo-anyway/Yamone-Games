name: Offline Android toolchain
on:
  push:
    branches: ["build/0.3.05-toolchain"]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: yamone-games-debug-keystore-v2
          fail-on-cache-miss: true
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Resolve exact new dependency and prepare compiler caches
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle.kts')
          t=p.read_text().replace('dependencies {','dependencies {\n    implementation("androidx.work:work-runtime-ktx:2.11.2")')
          p.write_text(t)
          PY
          gradle :app:assembleDebug testDebugUnitTest --no-daemon
      - name: Package offline build dependencies
        run: |
          mkdir -p /tmp/offline/sdk/platforms /tmp/offline/sdk/build-tools /tmp/offline/gradle-home /tmp/offline/signing
          cp -a "$ANDROID_HOME/platforms/android-36" /tmp/offline/sdk/platforms/
          cp -a "$ANDROID_HOME/build-tools/36.0.0" /tmp/offline/sdk/build-tools/
          cp -a "$ANDROID_HOME/licenses" /tmp/offline/sdk/
          cp -a "$HOME/.gradle/caches" /tmp/offline/gradle-home/
          cp -a "$(dirname "$(dirname "$(readlink -f "$(which gradle)")")")" /tmp/offline/gradle
          install -m 600 "$HOME/.android/debug.keystore" /tmp/offline/signing/debug.keystore
          tar -czf /tmp/offline-android.tar.gz -C /tmp/offline .
          split -b 300M -d -a 2 /tmp/offline-android.tar.gz /tmp/offline-part-
          ls -lh /tmp/offline-part-*
      - uses: actions/upload-artifact@v5
        with:
          name: offline-android-build-kit-00
          path: /tmp/offline-part-00
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v5
        with:
          name: offline-android-build-kit-01
          path: /tmp/offline-part-01
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v5
        with:
          name: offline-android-build-kit-02
          path: /tmp/offline-part-02
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
