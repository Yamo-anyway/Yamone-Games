name: Versioned Yamone Games
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Optional higher versionCode for rollback without uninstalling'
        required: false
        type: string
  push:
    branches: ["release/0.2.00", "redesign/0.3.00"]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Archive source
        run: git archive --format=zip --output=/tmp/Yamone-Games-source.zip HEAD
      - uses: actions/upload-artifact@v5
        with:
          name: Yamone-Games-source
          path: /tmp/Yamone-Games-source.zip
          retention-days: 30
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: yamone-games-debug-keystore-v2
          fail-on-cache-miss: true
      - name: Verify existing signing key
        run: test -f "$HOME/.android/debug.keystore"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Test and build
        env:
          ROLLBACK_CODE: ${{ inputs.version_code }}
        shell: bash
        run: |
          args=()
          if [[ -n "$ROLLBACK_CODE" ]]; then
            [[ "$ROLLBACK_CODE" =~ ^[1-9][0-9]{0,8}$ ]] || exit 1
            args+=("-PyamoneVersionCode=$ROLLBACK_CODE")
          fi
          set +e
          gradle :app:assembleDebug :app:testDebugUnitTest :games:arcadecore:testDebugUnitTest --no-daemon --console=plain "${args[@]}" > /tmp/build.log 2>&1
          result=$?
          cat /tmp/build.log
          exit "$result"
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee /tmp/signature.txt'
      - uses: actions/upload-artifact@v5
        with:
          name: Yamone-Games-versioned-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Yamone-Games-test-results
          path: |
            **/build/test-results/**/*.xml
            /tmp/build.log
            /tmp/signature.txt
          if-no-files-found: ignore
          retention-days: 30
