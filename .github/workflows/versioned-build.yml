name: Versioned Yamone Games
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Optional higher versionCode for rollback without uninstalling'
        required: false
        type: string
  push:
    branches: ["release/0.2.00", "redesign/0.3.00"]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.prepared.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply verified redesign delivery
        if: ${{ hashFiles('.delivery/source.01') != '' }}
        env:
          DELIVERY_BRANCH: ${{ github.ref_name }}
        run: |
          test "$DELIVERY_BRANCH" = "redesign/0.3.00"
          python .delivery/apply.py
          python -m pip install Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88
          python tools/rebuild_character_art.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app games tools docs VERSION_HISTORY.md
          git rm -r .delivery
          git diff --cached --check
          git commit -m 'feat: implement complete 0.3.00 design, audio, haptics and game rankings'
          git push origin "HEAD:$DELIVERY_BRANCH"
      - name: Prepared source
        id: prepared
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive --format=zip --output=/tmp/Yamone-Games-source.zip HEAD
      - uses: actions/upload-artifact@v5
        with:
          name: Yamone-Games-source
          path: /tmp/Yamone-Games-source.zip
          retention-days: 30
  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: yamone-games-debug-keystore-v2
          fail-on-cache-miss: true
      - name: Verify existing signing key
        run: test -f "$HOME/.android/debug.keystore"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Test and build
        env:
          ROLLBACK_CODE: ${{ inputs.version_code }}
        shell: bash
        run: |
          args=()
          if [[ -n "$ROLLBACK_CODE" ]]; then
            [[ "$ROLLBACK_CODE" =~ ^[1-9][0-9]{0,8}$ ]] || exit 1
            args+=("-PyamoneVersionCode=$ROLLBACK_CODE")
          fi
          gradle :app:assembleDebug :app:testDebugUnitTest :games:arcadecore:testDebugUnitTest --no-daemon --stacktrace "${args[@]}"
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk'
      - uses: actions/upload-artifact@v5
        with:
          name: Yamone-Games-versioned-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Yamone-Games-test-results
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: ignore
          retention-days: 30
