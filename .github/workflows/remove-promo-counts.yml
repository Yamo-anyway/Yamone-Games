name: Simplify promotion duration model

on:
  push:
    paths:
      - '.github/workflows/remove-promo-counts.yml'

permissions:
  contents: write

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remove promotion redemption-count logic
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # D1 migration: duration/permanent only.
          p = Path('cloudflare/migrations/003_promotions.sql')
          s = p.read_text()
          s = s.replace('    max_redemptions INTEGER,\n    redeemed_count INTEGER NOT NULL DEFAULT 0,\n', '')
          s = s.replace('-- max_redemptions: 전체 사용 가능 횟수. NULL이면 횟수 제한 없음.\n', '')
          p.write_text(s)

          # Worker: validate code + time only. No redemption counter mutation.
          p = Path('cloudflare/ranking-worker.js')
          s = p.read_text()
          s = s.replace(
              '      SELECT id, label, enabled, starts_at, expires_at, duration_minutes,\n             max_redemptions, redeemed_count\n',
              '      SELECT id, label, enabled, starts_at, expires_at, duration_minutes\n'
          )
          s = re.sub(
              r'\n  if \(promo\.max_redemptions != null && Number\(promo\.redeemed_count\) >= Number\(promo\.max_redemptions\)\) \{.*?\n  \}\n',
              '\n', s, count=1, flags=re.S
          )
          s = re.sub(
              r'\n  const update = await env\.DB.*?\n  if \(!update\?\.meta \|\| Number\(update\.meta\.changes \|\| 0\) < 1\) \{.*?\n  \}\n',
              '\n', s, count=1, flags=re.S
          )
          p.write_text(s)

          # Android: remove now-impossible exhausted state.
          p = Path('app/src/main/java/com/yamone/games/PromotionSupport.kt')
          s = p.read_text()
          s = s.replace('    data object Exhausted : PromotionRedeemResult\n', '')
          s = s.replace('    data object Exhausted : PromotionApiResult\n', '')
          s = s.replace('            PromotionApiResult.Exhausted -> PromotionRedeemResult.Exhausted\n', '')
          s = s.replace('                "PROMOTION_EXHAUSTED" -> PromotionApiResult.Exhausted\n', '')
          p.write_text(s)

          p = Path('app/src/main/java/com/yamone/games/YamoneGamesApp.kt')
          s = p.read_text()
          s = s.replace('                    PromotionRedeemResult.Exhausted -> adInfoMessage = "사용 가능 횟수가 모두 소진된 프로모션이에요."\n', '')
          p.write_text(s)

          # Docs: only temporary / permanent. Store-specific code limits are external policy.
          p = Path('cloudflare/PROMOTIONS.md')
          p.write_text('''# Yamone Games 프로모션 운영\n\n현재 프로모션은 **전면광고만 면제**합니다. 프로모션이 적용되어도 배너 광고는 계속 표시됩니다.\n\n프로모션 권한은 두 종류만 사용합니다.\n\n- **기간형**: 코드 적용 시점부터 지정 기간 동안 전면광고 면제\n- **무기한**: 만료 없이 전면광고 면제\n\n앱/Cloudflare에서는 프로모션 사용 횟수나 소진 횟수를 관리하지 않습니다. 향후 Apple/Google 공식 프로모션으로 전환하면 코드 발급/교환 한도는 각 스토어가 관리하고, 앱은 스토어가 확인한 결과를 기간형 또는 무기한 entitlement로만 변환합니다.\n\n프로모션 검증 요청에는 **프로모션 코드만** 전송합니다. 계정 ID, 기기 ID, 광고 ID, 닉네임, 게임 기록은 프로모션 API로 전송하지 않습니다.\n\n## Cloudflare 적용\n\n기존 Worker와 D1 `DB` 바인딩을 그대로 사용합니다.\n\n1. 기존 D1 데이터베이스에 `cloudflare/migrations/003_promotions.sql` 적용\n2. 변경된 `cloudflare/ranking-worker.js`를 기존 Worker에 재배포\n\n새 D1, KV, R2 또는 별도 유료 서비스는 필요하지 않습니다. 현재 릴리스의 랭킹 API는 비활성화되어 있고 프로모션 API만 사용합니다.\n\n## 코드 등록\n\nDB에는 코드 원문이 아니라 정규화된 코드의 SHA-256 해시를 저장합니다.\n\n```bash\nprintf 'YAMONE2026' | shasum -a 256\n```\n\n### 기간형 예시: 적용 후 7일\n\n```sql\nINSERT INTO promotions (\n  code_hash, label, enabled,\n  starts_at, expires_at, duration_minutes,\n  created_at, updated_at\n) VALUES (\n  '<SHA256_HASH>', '7일 프로모션', 1,\n  NULL, NULL, 10080,\n  unixepoch() * 1000,\n  unixepoch() * 1000\n);\n```\n\n### 무기한 예시\n\n```sql\nINSERT INTO promotions (\n  code_hash, label, enabled,\n  starts_at, expires_at, duration_minutes,\n  created_at, updated_at\n) VALUES (\n  '<SHA256_HASH>', '무기한 프로모션', 1,\n  NULL, NULL, NULL,\n  unixepoch() * 1000,\n  unixepoch() * 1000\n);\n```\n\n`expires_at`을 사용하면 코드 자체를 언제까지 교환할 수 있는지도 제한할 수 있습니다. `duration_minutes`와 함께 사용하면 실제 entitlement 만료는 둘 중 먼저 오는 시각으로 제한됩니다.\n\n## 향후 공식 스토어 프로모션 매핑\n\n앱 내부 모델은 그대로 유지합니다.\n\n- Store 결과가 기간형 상품/혜택이면 `validUntilMillis`를 저장\n- Store 결과가 영구 비소모성 상품이면 `validUntilMillis = null`로 저장\n- 두 경우 모두 `fullscreenAdsDisabled = true`, `bannerAdsRemain = true`\n\n따라서 나중에 광고제거 구매 기능을 추가해도 프로모션 entitlement와 영구 유료 광고제거 entitlement는 서로 독립적으로 유지할 수 있습니다.\n''')

          # Bump debug version to force a clean validation build.
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s = re.sub(r'versionCode = \d+', 'versionCode = 27', s, count=1)
          s = re.sub(r'versionName = "[^"]+"', 'versionName = "1.1.0-dev21"', s, count=1)
          p.write_text(s)
          PY

      - name: Commit simplified promotion model
        shell: bash
        run: |
          git config user.name "Yamo"
          git config user.email "diahnet@naver.com"
          git add cloudflare app
          if ! git diff --cached --quiet; then
            git commit -m "Simplify promotions to temporary or permanent"
            git push
          fi
