name: Compact Sudoku result

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/compact-sudoku-result.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Compact Sudoku result buttons
        run: python .github/scripts/compact_sudoku_result.py
      - name: Commit changes
        run: |
          git config user.name Yamo
          git config user.email diahnet@naver.com
          git add games/sudoku/src/main/java/com/yamone/games/sudoku/ui/SudokuApp.kt
          git diff --cached --quiet && exit 0
          git commit -m "Compact Sudoku result actions"
          git push
