name: Finalize ad promotion UI

on:
  push:
    paths:
      - '.github/workflows/finalize-ad-promo-ui.yml'

permissions:
  contents: write

jobs:
  finalize-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch promotion UI
        run: python3 .github/scripts/finalize_ad_promo_ui.py
      - name: Commit final UI
        shell: bash
        run: |
          git config user.name "Yamone UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/yamone/games/AdExperienceUi.kt
          git commit -m "Finalize fullscreen promotion UI"
          git push
