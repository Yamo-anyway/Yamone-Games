name: Finalize ad promotion UI

on:
  push:
    paths:
      - '.github/workflows/finalize-ad-promo-ui.yml'

permissions:
  contents: write

jobs:
  finalize-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Disable dormant ranking API
        run: python3 .github/scripts/disable_ranking_worker.py
      - name: Commit worker gate
        shell: bash
        run: |
          git config user.name "Yamone UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add cloudflare/ranking-worker.js
          git commit -m "Disable ranking API for initial release"
          git push
