name: Hide promotion UI until backend

on:
  push:
    paths:
      - '.github/scripts/hide_promo_until_backend.py'
      - '.github/workflows/hide-promo-until-backend.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply promotion UI gate
        run: python .github/scripts/hide_promo_until_backend.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "Yamo"
          git config user.email "diahnet@naver.com"
          git add app/src/main/java/com/yamone/games/AdExperienceUi.kt
          git commit -m "Hide promotion input until backend is enabled"
          git push
